name: Contract tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  direct-tests:
    runs-on: ubuntu-latest
    env:
      GLTEST_GENVM_VERSION: v0.2.16

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run direct contract tests
        run: pytest tests/direct/ -v
